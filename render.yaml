services:
  - type: web
    name: bmtc-college-lms
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements/production.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: bmtc-college-lms.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bmtc-college-lms-db
          property: connectionString
      - key: RESET_MIGRATIONS
        value: "false"
    healthCheckPath: /health/
    autoDeploy: true
    plan: free

databases:
  - name: bmtc-college-lms-db
    databaseName: bmtc_college_lms
    user: bmtc_college_lms_user
    plan: free 
